<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script src="../css-doodle.min.js"></script>
  <style>
    body { margin: 0; background: #222538; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden;}
  </style>
</head>
<body>
  <css-doodle>
    :doodle {
      @grid: 80x80 / 600px 720px;
    }

    @size: 80% 30%;

    background: @p(#f75f68, #fed163, #437190, #5da0a4, #f4e8d3, #fff, #b74f4b, #2b394f, #222538);

    transform: rotate(@flow(scale=2, frequency=1.5, sharp=0));

    border-radius: 20px;
    margin: 1px;
    opacity: @r(0.6, 1);

    width: @r(30%, 150%);
  </css-doodle>
</body>
</html>
